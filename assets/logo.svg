<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <!-- Градиенты для неонового эффекта -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <!-- Фильтр свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Группа иконки книги (без фоновой подложки) -->
  <g filter="url(#glow)" transform="translate(4, 2)">
    <!-- Левая страница -->
    <path d="M 14,40 Q 30,45 45,40 L 45,15 Q 30,20 14,15 Z" fill="none" stroke="url(#neonBlue)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 11,43 Q 30,49 45,43" fill="none" stroke="url(#neonBlue)" stroke-width="2" />

    <!-- Правая страница -->
    <path d="M 45,40 Q 60,45 76,40 L 76,15 Q 60,20 45,15 Z" fill="none" stroke="url(#neonBlue)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 45,43 Q 60,49 79,43" fill="none" stroke="url(#neonBlue)" stroke-width="2" />

    <!-- Линии текста слева -->
    <line x1="19" y1="21" x2="35" y2="21" stroke="url(#neonBlue)" stroke-width="2" stroke-linecap="round" />
    <line x1="19" y1="27" x2="39" y2="27" stroke="url(#neonBlue)" stroke-width="2" stroke-linecap="round" />
    <line x1="19" y1="33" x2="32" y2="33" stroke="url(#neonBlue)" stroke-width="2" stroke-linecap="round" />

    <!-- Зеленый значок диалога/сообщения на правой странице -->
    <path d="M 52,18 L 68,18 C 71,18 73,20 73,23 L 73,29 C 73,32 71,34 68,34 L 61,34 L 57,39 L 57,34 L 52,34 C 49,34 47,32 47,29 L 47,23 C 47,20 49,18 52,18 Z" fill="url(#neonGreen)" />
    <line x1="51" y1="23" x2="69" y2="23" stroke="#080f1e" stroke-width="2" stroke-linecap="round" />
    <line x1="51" y1="28" x2="63" y2="28" stroke="#080f1e" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Текст названия -->
  <text x="88" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#neonBlue)" filter="url(#glow)">ReadetReach</text>
</svg>